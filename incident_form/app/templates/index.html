<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация события</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <div class="header-row">
            <h1>Регистрация события</h1>
            <div class="id-field-wrapper">
                <label for="incident_id">ID:</label>
                <input type="number" id="incident_id" name="incident_id" placeholder="" min="1">
            </div>
        </div>
        
        <form id="incidentForm" method="POST">
            {{ form.hidden_tag() }}
            
            <div class="form-group">
                <label for="fio">ФИО *</label>
                <input type="text" id="fio" name="fio" list="fio-list" required placeholder="Введите или выберите ФИО">
                <datalist id="fio-list">
                    <option value="Бобровский Андрей">
                    <option value="Викторов Валерий">
                    <option value="Игнатов Андрей">
                    <option value="Киселёв Роман">
                </datalist>
                <span class="error" id="fio-error"></span>
            </div>
            
            <div class="form-group">
                <label>Дата, время и актуальность *</label>
                <div class="datetime-row">
                    <input type="date" id="event_date" name="event_date" required>
                    <input type="text" id="event_time" name="event_time" required 
                           placeholder="ЧЧ:ММ" maxlength="5"
                           pattern="([01]?[0-9]|2[0-3]):[0-5][0-9]"
                           title="Формат: ЧЧ:ММ">
                    <input type="number" id="validity_days" name="validity_days" min="1" max="365" placeholder="Дней">
                </div>
                <input type="hidden" id="event_datetime" name="event_datetime">
                <span class="error" id="event_datetime-error"></span>
                <span class="error" id="validity_days-error"></span>
            </div>
            
            <div class="form-group">
                <label for="tag">Тег *</label>
                <select id="tag" name="tag" required>
                    <option value="Мониторинг" selected>Мониторинг</option>
                    <option value="Латенси">Латенси</option>
                    <option value="Информация">Информация</option>
                    <option value="Массовое">Массовое</option>
                    <option value="ОТМ">ОТМ</option>
                    <option value="Veeam">Veeam</option>
                </select>
                <span class="error" id="tag-error"></span>
            </div>
            
            <div class="form-group compact">
                <label for="event_description">Описание события</label>
                <textarea id="event_description" name="event_description" rows="4" placeholder="Опишите событие" style="resize: vertical;"></textarea>
                <span class="error" id="event_description-error"></span>
            </div>
            
            <div class="form-group compact">
                <label for="engineer_actions">Действия инженера</label>
                <textarea id="engineer_actions" name="engineer_actions" rows="4" placeholder="Опишите действия инженера" style="resize: vertical;"></textarea>
                <span class="error" id="engineer_actions-error"></span>
            </div>
            
            <button type="submit" class="submit-btn">Зарегистрировать событие</button>
        </form>
    </div>
    
    <div id="toast" class="toast"></div>
    
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
